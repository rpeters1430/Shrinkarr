# Example topology showing Shrinkarr deployed alongside a typical media
# stack, all sharing the same media volume so paths line up across
# containers. Adjust images, ports, and PUID/PGID to match your existing
# setup before using this for real.

services:
  shrinkarr:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: shrinkarr
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - /volume1/Media:/volume1/Media
      # - /volume2/scratch:/tmp/shrinkarr
    devices:
      - /dev/dri:/dev/dri
    cpu_shares: 256

  jellyfin:
    image: jellyfin/jellyfin:latest@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /volume1/Media:/volume1/Media
    devices:
      - /dev/dri:/dev/dri

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:4d9df314875e1249ab7d6170c2b9b3dc1d8e6383f168ceb10dc9a5ad9b324739
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "8989:8989"
    volumes:
      - ./sonarr/config:/config
      - /volume1/Media:/volume1/Media

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "7878:7878"
    volumes:
      - ./radarr/config:/config
      - /volume1/Media:/volume1/Media
