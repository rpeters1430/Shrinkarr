# Example topology showing Shrinkarr deployed alongside a typical media
# stack, all sharing the same media volume so paths line up across
# containers. Adjust images, ports, and PUID/PGID to match your existing
# setup before using this for real.

services:
  shrinkarr:
    # Prebuilt multi-arch image tracking validated latest. Replace :latest
    # with a release digest to hold a fixed version. Use the `build:` block
    # only if developing from a local checkout.
    image: ghcr.io/rpeters1430/shrinkarr:latest
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    container_name: shrinkarr
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - /volume1/Media:/volume1/Media
      # - /volume2/scratch:/tmp/shrinkarr
    devices:
      - /dev/dri:/dev/dri
    cpu_shares: 256

  jellyfin:
    image: jellyfin/jellyfin:latest@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /volume1/Media:/volume1/Media
    devices:
      - /dev/dri:/dev/dri

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:386c962ee6e260e3a5656b25df2ed056bcc9b6410e197d075f9547fd14c23bca
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "8989:8989"
    volumes:
      - ./sonarr/config:/config
      - /volume1/Media:/volume1/Media

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "7878:7878"
    volumes:
      - ./radarr/config:/config
      - /volume1/Media:/volume1/Media
