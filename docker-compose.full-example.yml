# Example topology showing Shrinkarr deployed alongside a typical media
# stack, all sharing the same media volume so paths line up across
# containers. Adjust images, ports, and PUID/PGID to match your existing
# setup before using this for real.

services:
  shrinkarr:
    # Prebuilt multi-arch image (linux/amd64 + linux/arm64) from GHCR, pinned
    # by digest like the other images below -- swap for the `build:` block
    # only if developing from a local checkout.
    image: ghcr.io/rpeters1430/shrinkarr:latest@sha256:cba313ce9178f55ab83ca22a2c373200ba5a636465d246f8f5e16371d9faac11
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    container_name: shrinkarr
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - /volume1/Media:/volume1/Media
      # - /volume2/scratch:/tmp/shrinkarr
    devices:
      - /dev/dri:/dev/dri
    cpu_shares: 256

  jellyfin:
    image: jellyfin/jellyfin:latest@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /volume1/Media:/volume1/Media
    devices:
      - /dev/dri:/dev/dri

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:a5c1a5fecbef946927ab90ad68df319ac5fe644057e5fc18cd993f01ac07b2b2
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "8989:8989"
    volumes:
      - ./sonarr/config:/config
      - /volume1/Media:/volume1/Media

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:c960f2b52ec6542dbe6707c5a21e696a7c74fd8b17997454f4d10a55dacee133
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "7878:7878"
    volumes:
      - ./radarr/config:/config
      - /volume1/Media:/volume1/Media
