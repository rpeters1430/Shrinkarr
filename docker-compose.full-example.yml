# Example topology showing Shrinkarr deployed alongside a typical media
# stack, all sharing the same media volume so paths line up across
# containers. Adjust images, ports, and PUID/PGID to match your existing
# setup before using this for real.

services:
  shrinkarr:
    # Prebuilt multi-arch image tracking validated latest. Replace :latest
    # with a release digest to hold a fixed version. Use the `build:` block
    # only if developing from a local checkout.
    image: ghcr.io/rpeters1430/shrinkarr:latest
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    container_name: shrinkarr
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - /volume1/Media:/volume1/Media
      # - /volume2/scratch:/tmp/shrinkarr
    devices:
      - /dev/dri:/dev/dri
    cpu_shares: 256

  jellyfin:
    image: jellyfin/jellyfin:latest@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /volume1/Media:/volume1/Media
    devices:
      - /dev/dri:/dev/dri

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:48e36b608b461273b9dae857725cd0561a127f2c694b687318f6d0c5ce63e5c9
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "8989:8989"
    volumes:
      - ./sonarr/config:/config
      - /volume1/Media:/volume1/Media

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:fc0ae3c50f8128b97e84381903ec8d6845c3a569641cb7117c124376cccb57c1
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "7878:7878"
    volumes:
      - ./radarr/config:/config
      - /volume1/Media:/volume1/Media
