# Example topology showing Shrinkarr deployed alongside a typical media
# stack, all sharing the same media volume so paths line up across
# containers. Adjust images, ports, and PUID/PGID to match your existing
# setup before using this for real.

services:
  shrinkarr:
    # Prebuilt multi-arch image (linux/amd64 + linux/arm64) from GHCR, pinned
    # by digest like the other images below -- swap for the `build:` block
    # only if developing from a local checkout.
    image: ghcr.io/rpeters1430/shrinkarr:latest@sha256:411d1925013776714ee4b8667f901e51379a420e8f5e9affb34babb9993fe640
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    container_name: shrinkarr
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - /volume1/Media:/volume1/Media
      # - /volume2/scratch:/tmp/shrinkarr
    devices:
      - /dev/dri:/dev/dri
    cpu_shares: 256

  jellyfin:
    image: jellyfin/jellyfin:latest@sha256:baba630419915985442f315f08b0cf46d9f4c8a0cc4bd38e94a6d35751dd5ef5
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /volume1/Media:/volume1/Media
    devices:
      - /dev/dri:/dev/dri

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:82172b363f9eddc02aca544f880a044f2ceb9aaf190bc87e4454e2f705eb91d0
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "8989:8989"
    volumes:
      - ./sonarr/config:/config
      - /volume1/Media:/volume1/Media

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:95ba0801df4d9d1d79d0d9a3849f656542497dab061d91b87ad4f53a71aff3ef
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "7878:7878"
    volumes:
      - ./radarr/config:/config
      - /volume1/Media:/volume1/Media
