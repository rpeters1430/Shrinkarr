# Copy this file to config/config.yaml and edit it for your setup.

libraries:
  - id: movies
    name: Movies
    path: /media/movies
    mediaType: movie
    presetId: hevc-save-space
    # Optional: files and folders to leave out of scans. A bare name matches
    # at any depth; a path with "/" starts at the library folder.
    # excludePatterns: ["Extras", "Featurettes", "*sample*"]
  - id: tv
    name: TV Shows
    path: /media/tv
    mediaType: tv
    presetId: hevc-save-space

presets:
  # Sane default: convert anything not already HEVC to HEVC, skip files
  # where the estimated space savings wouldn't be worth the re-encode.
  - id: hevc-save-space
    name: "H.265 to save space"
    targetCodec: hevc
    targetContainer: mkv
    crf: 24
    hwaccel: vaapi
    minSavingsPercent: 15
    # Optional track cleanup. Untagged tracks are always kept, and if no audio
    # track matches, all audio is kept.
    # keepAudioLanguages: [eng]
    # keepSubtitleLanguages: [eng]
    # Add an AAC 2.0 downmix when every kept audio track is surround.
    # addStereoAudio: true
    # Scale larger videos down: none, 2160p, 1440p, 1080p, 720p or 480p.
    # maxResolution: none
    # Remux (copy the video, no re-encode) files whose video is already fine
    # but that sit in an old container (AVI, WMV, MPEG-TS) or need the track
    # cleanup above. Defaults to true.
    # remuxWhenVideoIsFine: true

# Uncomment and fill in the services you want Shrinkarr to notify after a
# successful transcode. All are optional.
integrations: {}
  # jellyfin:
  #   url: http://jellyfin:8096
  #   apiKey: "your-jellyfin-api-key"
  # emby:
  #   url: http://emby:8096
  #   apiKey: "your-emby-api-key"
  # plex:
  #   url: http://plex:32400
  #   token: "your-plex-token"
  #   sectionId: "1"
  # sonarr:
  #   url: http://sonarr:8989
  #   apiKey: "your-sonarr-api-key"
  # radarr:
  #   url: http://radarr:7878
  #   apiKey: "your-radarr-api-key"

queue:
  concurrency: 1
  # Which pending job runs next: "savings" (largest estimated savings first)
  # or "oldest" (first in, first out).
  order: savings
  tempSuffix: ".shrinkarr.tmp"
  # Optional: intermediate directory for encoding (e.g. SSD/NVMe volume or /dev/shm RAM disk)
  # Prevents mechanical HDD thrashing while transcoding.
  # tempDirectory: "/tmp/shrinkarr"

  # Automatically pause background transcode jobs whenever someone is actively
  # streaming media on Jellyfin, Emby, or Plex to eliminate playback stutter.
  pauseOnStreaming: true

  # Process priority: runs FFmpeg at nice level 19 and ionice class 2 (best-effort lowest).
  # Guarantees the Linux kernel always prioritizes other NAS tasks first.
  lowPriority: true

  # Limit CPU threads used by FFmpeg (0 = auto). Set to e.g. 4 on a 10-core NAS.
  threads: 0

  # Optional weekly processing schedule. Day numbers: 0=Sunday through 6=Saturday.
  # The example allows work Monday-Friday from 7:30 AM to 5:00 PM.
  # schedule:
  #   enabled: true
  #   timezone: "America/Los_Angeles"
  #   windows:
  #     - { day: 0, enabled: false, start: "07:30", end: "17:00" }
  #     - { day: 1, enabled: true,  start: "07:30", end: "17:00" }
  #     - { day: 2, enabled: true,  start: "07:30", end: "17:00" }
  #     - { day: 3, enabled: true,  start: "07:30", end: "17:00" }
  #     - { day: 4, enabled: true,  start: "07:30", end: "17:00" }
  #     - { day: 5, enabled: true,  start: "07:30", end: "17:00" }
  #     - { day: 6, enabled: false, start: "07:30", end: "17:00" }
  #   stopActiveOnExit: true # stop and reschedule work when an active window ends

  minFreeSpaceGb: 10
  fileStabilityDelaySeconds: 15

  # Decode check on the source before each transcode: off, quick (three short
  # samples) or thorough (the whole file). Corrupt files are marked and never
  # replaced.
  healthCheck: quick
  # Health checks queued from the Library run in their own pool of this size.
  healthCheckConcurrency: 1

scanner:
  # How many ffprobe processes run at once while indexing. Raise it for large
  # libraries on fast local disks; lower it for slow network shares.
  probeConcurrency: 4

# Sonarr/Radarr import webhook. In each app add Settings -> Connect -> Webhook
# with the URL shown in Shrinkarr's Settings page (POST /api/webhooks/arr with
# its token), and Shrinkarr checks the library a file was imported into.
webhooks:
  # Only needed when Sonarr/Radarr mount your media at a different path.
  pathMappings: []
  # pathMappings:
  #   - from: /tv
  #     to: /media/tv

# Messages about finished jobs. Fill in any targets you use; Settings has a
# "Send Test" button to check them.
notifications:
  # discordWebhookUrl: https://discord.com/api/webhooks/...
  # ntfyUrl: https://ntfy.sh/your-topic
  # ntfyToken: tk_...            # only for topics that require a login
  # webhookUrl: https://example.com/hook   # JSON POST: { event, title, message, job }
  onJobFailed: true
  onQueueEmpty: true   # one summary when the queue runs out of work
  onJobDone: false     # one message per finished file

dbPath: data/shrinkarr.db

