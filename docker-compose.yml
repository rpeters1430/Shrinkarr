services:
  shrinkarr:
    # Pulls the prebuilt multi-arch image (linux/amd64 + linux/arm64) from GHCR,
    # pinned by digest (not just the mutable `:latest` tag) so the exact image
    # content is verified and reproducible -- Renovate opens a PR to bump this
    # digest whenever a new build is published. This is the recommended path
    # for NAS hardware: compiling TypeScript on a NAS CPU is slow and
    # unnecessary. Only use `build:` below if you're developing against a
    # local checkout of this repo.
    image: ghcr.io/rpeters1430/shrinkarr:latest@sha256:0caa6b8d77b7cc278bc75c75efefb71b6df113937d22c9226e482408d677034f
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile

    container_name: shrinkarr
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      # Match these to the UID/GID your other media containers (Jellyfin,
      # Sonarr, Radarr...) already run as, so files Shrinkarr writes back
      # into your media library come out with the same ownership.
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York

    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - /mnt/nas/Media:/volume1/Media
      # Optional: Mount a fast NVMe/SSD folder or RAM disk for intermediate transcode
      # files so mechanical HDDs don't experience seek thrashing during re-encoding.
      # - /volume2/scratch:/tmp/shrinkarr

    devices:
      # Intel QuickSync (Intel Iris Xe GPU on UGREEN 4800 Pro) & VAAPI passthrough
      - /dev/dri:/dev/dri

    # CPU Scheduling Priority: 256 shares (lower than default 1024) ensures
    # Jellyfin/Plex and NAS file transfers always get first priority on CPU cycles.
    cpu_shares: 256

    # Optional hard container limits to guarantee NAS stability:
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4.0'
    #       memory: 4G
    #     reservations:
    #       memory: 1G
