services:
  shrinkarr:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: shrinkarr
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      # Match these to the UID/GID your other media containers (Jellyfin,
      # Sonarr, Radarr...) already run as, so files Shrinkarr writes back
      # into your media library come out with the same ownership.
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York

    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - /mnt/nas/Media:/volume1/Media

    devices:
      # Intel QuickSync & AMD VAAPI hardware transcoding GPU passthrough
      - /dev/dri:/dev/dri
